name: Deploy to webgo.de
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm install --no-save sharp
      - run: node .github/scripts/optimize-images.cjs
      - run: npm run build
      - run: npm install --no-save ssh2-sftp-client
      - name: Deploy via SFTP
        timeout-minutes: 5
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /home/www/csc-nordhigh.de
        run: node .github/scripts/deploy.cjs
