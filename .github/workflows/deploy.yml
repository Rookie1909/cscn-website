name: Deploy to webgo.de
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy via SFTP (lftp mirror)
        timeout-minutes: 5
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
          set sftp:auto-confirm yes;
          set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\";
          open -u \"\$FTP_USERNAME\",\"\$FTP_PASSWORD\" sftp://\$FTP_HOST:22;
          mirror -R --delete --verbose ./dist/ /csc-nordhigh.de/;
          bye
          "
