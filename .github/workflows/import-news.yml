name: Import news post from Cannanas
on:
  # Sent by the n8n workflow "Cannanas -> Multi-Channel Sync"
  repository_dispatch:
    types: [cannanas-post]
  # Manual test: paste a client_payload JSON, e.g.
  # {"post_id":"test-1","title":"Testbeitrag","body_markdown":"Erster Absatz.\n\nZweiter Absatz.","image_urls":[],"created_at":"2026-09-26T10:00:00Z"}
  workflow_dispatch:
    inputs:
      payload:
        description: 'client_payload als JSON'
        required: true

permissions:
  contents: write
  actions: write

# No concurrency group on purpose: GitHub keeps only one pending run per group
# and cancels the rest, which would silently drop posts when n8n sends several
# at once. Parallel runs instead retry on a rejected push (see below).

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Import post, commit and push
        id: push
        env:
          NEWS_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.payload }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          git config user.name "cannanas-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          NEWS_ID=$(node -p 'JSON.parse(process.env.NEWS_PAYLOAD).post_id' | tr -cd 'A-Za-z0-9_-')
          CACHE=.github/translation-cache.json
          echo '{}' > "$RUNNER_TEMP/carried-usage.json"
          for i in 1 2 3 4 5 6; do
            # The import script is idempotent, so when another run pushed first
            # we simply start over from the new main and import again.
            cp "$CACHE" "$RUNNER_TEMP/cache-start.json"
            node .github/scripts/import-news-post.cjs
            git add src/data/news.json public/images/News_Pics .github/translation-cache.json
            if git diff --staged --quiet; then
              echo "News-Eintrag unverändert."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "chore(news): Beitrag cannanas-$NEWS_ID aus Cannanas übernehmen"
            if git push origin HEAD:main; then
              echo "Push succeeded."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected, retrying on the latest main ($i/6)..."
            sleep $((RANDOM % 10 + 5))
            # Keep this attempt's translations and usage, so the retry doesn't
            # send the same texts to Google again.
            cp "$CACHE" "$RUNNER_TEMP/cache-ours.json"
            git fetch -q origin main
            git reset -q --hard origin/main
            node .github/scripts/merge-translation-cache.cjs "$RUNNER_TEMP/cache-start.json" "$RUNNER_TEMP/cache-ours.json" "$RUNNER_TEMP/carried-usage.json"
          done
          echo "::error::Failed to push news import after 6 attempts."
          exit 1
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deployment explicitly.
      - name: Trigger deployment
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
