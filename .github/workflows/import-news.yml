name: Import news post from Cannanas
on:
  # Sent by the n8n workflow "Cannanas -> Multi-Channel Sync"
  repository_dispatch:
    types: [cannanas-post]
  # Manual test: paste a client_payload JSON, e.g.
  # {"post_id":"test-1","title":"Testbeitrag","body_markdown":"Erster Absatz.\n\nZweiter Absatz.","image_urls":[],"created_at":"2026-09-26T10:00:00Z"}
  workflow_dispatch:
    inputs:
      payload:
        description: 'client_payload als JSON'
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: import-news
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Write post into src/data/news.json
        id: import
        env:
          NEWS_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.payload }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node .github/scripts/import-news-post.cjs
      - name: Commit and push
        id: push
        env:
          NEWS_ID: ${{ steps.import.outputs.news_id }}
        run: |
          git config user.name "cannanas-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/news.json public/images/News_Pics
          if git diff --staged --quiet; then
            echo "News-Eintrag unverändert."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(news): Beitrag $NEWS_ID aus Cannanas übernehmen"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push succeeded."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected or conflicted, retrying ($i/5)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Failed to push news import after 5 attempts."
          exit 1
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deployment explicitly.
      - name: Trigger deployment
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
