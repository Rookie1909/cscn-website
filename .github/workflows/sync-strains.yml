name: Sync strains from Cannanas
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch current strains from Cannanas
        env:
          CANNANAS_API_KEY: ${{ secrets.CANNANAS_API_KEY }}
          CANNANAS_CLUB_ID: ${{ secrets.CANNANAS_CLUB_ID }}
        run: node .github/scripts/sync-strains.cjs
      - name: Commit and push if data changed
        run: |
          git config user.name "cannanas-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/strains-sync.json
          if git diff --staged --quiet; then
            echo "No changes in strain data."
          else
            git commit -m "chore: sync strains from Cannanas"
            git push
          fi
