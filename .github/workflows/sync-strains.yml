name: Sync data from Cannanas
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cannanas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch current strains from Cannanas
        env:
          CANNANAS_API_KEY: ${{ secrets.CANNANAS_API_KEY }}
          CANNANAS_CLUB_ID: ${{ secrets.CANNANAS_CLUB_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node .github/scripts/sync-strains.cjs
      - name: Fetch active grow rooms from Cannanas
        env:
          CANNANAS_API_KEY: ${{ secrets.CANNANAS_API_KEY }}
          CANNANAS_CLUB_ID: ${{ secrets.CANNANAS_CLUB_ID }}
        run: node .github/scripts/sync-grow-rooms.cjs
      - name: Fetch genetics library from Cannanas
        env:
          CANNANAS_API_KEY: ${{ secrets.CANNANAS_API_KEY }}
          CANNANAS_CLUB_ID: ${{ secrets.CANNANAS_CLUB_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node .github/scripts/sync-genetics.cjs
      - name: Commit and push if data changed
        run: |
          git config user.name "cannanas-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/strains-sync.json public/images/strains src/data/grow-rooms.json public/images/zones src/data/genetics.json .github/translation-cache.json
          if git diff --staged --quiet; then
            echo "No changes in Cannanas data."
            exit 0
          fi
          git commit -m "chore: sync data from Cannanas"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected or conflicted, retrying ($i/5)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Failed to push Cannanas sync after 5 attempts."
          exit 1
